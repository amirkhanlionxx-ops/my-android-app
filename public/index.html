<!doctype html>
<html lang="en" style="background:#000000;color:#ffffff;height:100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Remix Remix Remix ANDROID IDE PLATFORM</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ANDROID" />
    <meta name="description" content="Mobile Android IDE platform with project tools, templates, full file tree, and code editor." />
    <meta property="og:title" content="Remix Remix Remix ANDROID IDE PLATFORM" />
    <meta property="og:description" content="Mobile Android IDE platform with project tools, templates, full file tree, and code editor." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/android_logo.png" />
    <link rel="apple-touch-icon" href="/android_logo.png" />
    <meta property="og:image" content="/android_logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000 !important;
        color: #ffffff;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      @keyframes spinLoader {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </head>
  <body style="background:#000000;color:#ffffff;margin:0;padding:0;overflow:hidden;height:100%;">
    <div id="root">
      <div id="initial-page-preloader" style="position:fixed;inset:0;width:100vw;height:100dvh;background:#000000;display:flex;align-items:center;justify-content:center;z-index:999999999;flex-direction:column;cursor:pointer;">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:pulseGlow 1.8s ease-in-out infinite;">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:20px;background:#090d16;border:4px solid #00b0ff;box-shadow:0 4px 22px rgba(0, 176, 255, 0.45);margin-bottom:14px;padding:6px;overflow:hidden;">
            <img src="/android_logo.png" alt="Android Logo" style="width:100%;height:100%;border-radius:12px;object-fit:contain;display:block;" onerror="this.style.display='none'" />
          </div>
          <span style="display:block;color:#3DDC84;font-family:sans-serif;font-weight:700;font-size:19px;letter-spacing:1.5px;margin-bottom:12px;">ANDROID</span>
          <div style="width:28px;height:28px;border:3px solid rgba(0, 176, 255, 0.2);border-top-color:#00b0ff;border-radius:50%;animation:spinLoader 0.75s linear infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
